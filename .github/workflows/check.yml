# בדיקות לכל PR (ולכל push ל־main): טיפוסים, בדיקות יחידה ובניית האתר.
# כך PR שנכשל בבדיקה נראה אדום לפני המיזוג, ולא רק אחרי שהבנייה ב־main נשברת.
name: Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web bundle
        run: npm run build:web

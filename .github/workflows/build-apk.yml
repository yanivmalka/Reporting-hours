name: Build Android APK

# בונה APK חתום ומפרסם אותו כ־GitHub Release — רק כשצריך:
#   - push ל־main שמשנה קבצים שמשפיעים על השכבה הנייטיבית (תלויות, app.json, נכסים, הבנייה עצמה);
#   - push ל־main שבהודעת ה־commit יש [apk];
#   - הפעלה ידנית (Run workflow).
# שינויי קוד JS בלבד מתעדכנים באתר (deploy-web) בלי לבנות APK.
# האפליקציה בודקת את ה־Release האחרון (lib/update.ts) ומציעה עדכון.
#
# חתימה: אנדרואיד מתקין עדכון רק אם הוא חתום באותו מפתח כמו הגרסה המותקנת.
# אם הוגדרו הסודות ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
# ANDROID_KEY_ALIAS — החתימה נעשית בהם. אחרת נעשה שימוש במפתח ה־debug הקבוע
# של תבנית Expo (יציב בין בניות, אבל ציבורי — מתאים לשימוש אישי בלבד).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if printf '%s' "$MSG" | grep -qiF '[apk]'; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -qE '^(package\.json|package-lock\.json|app\.json|app\.config\.(js|ts)|eas\.json|assets/|plugins/|\.github/workflows/build-apk\.yml)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::JS-only change — APK not rebuilt (the website is updated). Add [apk] to the commit message or run the workflow manually to build one."
          fi

  apk:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION: 0.1.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Prepare signing key
        id: sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "file=$RUNNER_TEMP/release.jks"
              echo "pass=$KS_PASS"
              echo "alias=$KS_ALIAS"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release keystore secrets — signing with the stable Expo debug key."
            {
              echo "file=$GITHUB_WORKSPACE/android/app/debug.keystore"
              echo "pass=android"
              echo "alias=androiddebugkey"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.injected.signing.store.file="${{ steps.sign.outputs.file }}" \
            -Pandroid.injected.signing.store.password="${{ steps.sign.outputs.pass }}" \
            -Pandroid.injected.signing.key.alias="${{ steps.sign.outputs.alias }}" \
            -Pandroid.injected.signing.key.password="${{ steps.sign.outputs.pass }}"

      - name: Show signing certificate
        # SHA-1 must match the fingerprint registered in Firebase (malka-apps → Android app), or Google sign-in fails.
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -E "SHA-1|SHA-256 digest"

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/reporting-hours-${APP_VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: גרסה ${{ env.APP_VERSION }}
          make_latest: true
          body: |
            בנייה ${{ github.run_number }} · commit ${{ github.sha }}

            ${{ github.event.head_commit.message }}
          files: out/*.apk
